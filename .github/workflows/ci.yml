name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Run unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Check tool version consistency
        run: |
          TOOL_VER=$(python -c "from auditor.engine import TOOL_VERSION; print(TOOL_VERSION)")
          FILE_VER=$(cat VERSION)
          echo "engine.py TOOL_VERSION = $TOOL_VER"
          echo "VERSION file           = $FILE_VER"
          if [ "$TOOL_VER" != "$FILE_VER" ]; then
            echo "ERROR: Version mismatch between engine.py and VERSION file"
            exit 1
          fi
          echo "Version check passed: $TOOL_VER"
